<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>In / Out Board · HostelHub</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="app-shell">
  <div class="sidebar-backdrop"></div>
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main">
    <header class="topbar" id="topbar"></header>

    <main class="content">
      <div class="page-header-row">
        <div>
          <h2>In / Out Board</h2>
          <p class="desc" id="pageDesc">Live hostel-wide check-in and check-out tracking for every active hosteller.</p>
        </div>
      </div>

      <div class="stat-grid stat-grid-tight" id="statGrid"></div>

      <div class="table-card">
        <div class="table-toolbar">
          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
            <input type="text" id="searchInput" placeholder="Search by hosteller name...">
          </div>
          <div class="toolbar-filters">
            <input type="date" class="select-filter" id="dateFilter">
            <span class="toolbar-meta" id="toolbarMeta"></span>
          </div>
        </div>
        <div class="table-scroll">
          <table class="data-table">
            <thead>
              <tr>
                <th data-sort="name">Hosteller</th><th data-sort="room">Room</th><th data-sort="status">Status</th><th data-sort="since">Last Movement</th><th id="actionHeader">Action</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
        <div class="table-pagination" id="pagination"></div>
      </div>
    </main>
  </div>
</div>

<div class="modal-overlay" id="ioModal">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="ioModalTitle">Mark In / Out</h3>
      <button class="modal-close" id="ioModalClose">&times;</button>
    </div>
    <div class="modal-body">
      <form id="ioForm">
        <div class="field-grid cols-1">
          <div class="field">
            <label>Reason / Notes (optional)</label>
            <textarea id="fReason" placeholder="e.g. Library, Home visit, Class..."></textarea>
          </div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" id="ioCancelBtn">Cancel</button>
      <button class="btn btn-primary" id="ioSaveBtn">Confirm</button>
    </div>
  </div>
</div>

<script src="assets/data.js"></script>
<script src="assets/business.js"></script>
<script src="assets/app.js"></script>
<script src="assets/charts.js"></script>
<script>
  App.requireAuth();
  if (App.guardPermission("attendance", "read")) {
  App.renderShell({ active: "hostel-attendance", title: "In / Out Board", subtitle: "Live hostel-wide check-in / check-out tracking" });

  var canUpdate = App.can("attendance", "update");
  var searchTerm = "";
  var currentPage = 1;
  var PAGE_SIZE = 10;
  var sortState = App.makeSortState();
  var todayIso = Data.isoDate(Data.today());
  document.getElementById("dateFilter").value = todayIso;

  function render() {
    var dateIso = document.getElementById("dateFilter").value || todayIso;
    var isToday = dateIso === todayIso;
    document.getElementById("pageDesc").textContent = isToday
      ? "Live hostel-wide check-in and check-out tracking for every active hosteller."
      : "Attendance report for " + Data.displayDate(dateIso) + " — who was in and who was out.";
    document.getElementById("actionHeader").textContent = isToday ? "Action" : "";

    var rows = Business.getAttendanceForDate(dateIso);
    var inCount = rows.filter(function (r) { return r.status === "in"; }).length;
    var outCount = rows.length - inCount;
    var missing = isToday ? Business.getMissingStudents() : [];

    document.getElementById("statGrid").innerHTML =
      '<div class="stat-card"><div class="stat-icon icon-indigo">' + App.svg("users") + '</div><div><div class="stat-value">' + rows.length + '</div><div class="stat-label">Active hostellers</div></div></div>' +
      '<div class="stat-card accent-cyan"><div class="stat-icon icon-cyan">' + App.svg("checkCircle") + '</div><div><div class="stat-value">' + inCount + '</div><div class="stat-label">' + (isToday ? "Currently in" : "In on this date") + '</div></div></div>' +
      '<div class="stat-card accent-amber"><div class="stat-icon icon-amber">' + App.svg("inout") + '</div><div><div class="stat-value">' + outCount + '</div><div class="stat-label">' + (isToday ? "Currently out" : "Out on this date") + '</div></div></div>' +
      '<div class="stat-card accent-red"><div class="stat-icon icon-red">' + App.svg("alertTriangle") + '</div><div><div class="stat-value">' + missing.length + '</div><div class="stat-label">Missing / overdue</div></div></div>';

    var rooms = Data.getRooms();
    var q = searchTerm.toLowerCase();
    var filtered = rows.filter(function (r) { return !q || r.student.name.toLowerCase().indexOf(q) > -1; });
    filtered = App.sortRows(filtered, sortState, {
      name: function (r) { return r.student.name; },
      room: function (r) { var rm = rooms.find(function (x) { return x.id === r.student.roomId; }); return rm ? rm.roomNumber : ""; },
      status: function (r) { return r.status; },
      since: function (r) { return r.since || ""; }
    });
    document.getElementById("toolbarMeta").textContent = filtered.length + " of " + rows.length + " hostellers";

    var tbody = document.getElementById("tableBody");
    var pageItems = App.paginate(filtered, currentPage, PAGE_SIZE);
    if (!filtered.length) {
      tbody.innerHTML = '<tr><td colspan="5"><div class="empty-state compact">' + App.svg("inout") + '<p>No hostellers found.</p></div></td></tr>';
    } else {
      tbody.innerHTML = pageItems.map(function (r) {
        var s = r.student;
        var room = rooms.find(function (x) { return x.id === s.roomId; });
        var nextDirection = r.status === "out" ? "in" : "out";
        var btnLabel = nextDirection === "in" ? "Mark In" : "Mark Out";
        var btnCls = nextDirection === "in" ? "btn-success" : "btn-outline";
        return '<tr>' +
          '<td><div class="cell-user"><div class="cell-avatar">' + App.initials(s.name) + '</div><div><strong>' + s.name + '</strong></div></div></td>' +
          '<td>' + (room ? '<span class="chip chip-indigo">' + room.roomNumber + '</span>' : '<span class="chip chip-slate">Unassigned</span>') + '</td>' +
          '<td><span class="status-pill ' + r.status + '">' + r.status + '</span></td>' +
          '<td>' + (r.since ? Data.displayDateTime(r.since) + (r.reason ? ' · ' + r.reason : '') : "-") + '</td>' +
          '<td class="row-actions" style="text-align:left">' +
            (isToday && canUpdate ? '<button class="btn btn-sm ' + btnCls + '" data-mark="' + s.id + '" data-direction="' + nextDirection + '">' + btnLabel + '</button>' : '') +
          '</td>' +
        '</tr>';
      }).join("");
    }

    currentPage = App.renderPagination(document.getElementById("pagination"), {
      page: currentPage, pageSize: PAGE_SIZE, total: filtered.length,
      onChange: function (p) { currentPage = p; render(); }
    });

    App.bindSortableTable(tbody.closest("table").tHead, sortState, function () { currentPage = 1; render(); });
  }

  document.getElementById("searchInput").addEventListener("input", function (e) { searchTerm = e.target.value; currentPage = 1; render(); });
  document.getElementById("dateFilter").addEventListener("change", function () { currentPage = 1; render(); });

  /* ---------------- Mark In/Out modal ---------------- */
  var modal = document.getElementById("ioModal");
  var targetStudentId = "", targetDirection = "";
  function openIoModal(studentId, direction) {
    targetStudentId = studentId; targetDirection = direction;
    var s = Data.getStudents().find(function (x) { return x.id === studentId; });
    document.getElementById("ioModalTitle").textContent = (direction === "in" ? "Mark In — " : "Mark Out — ") + (s ? s.name : "");
    document.getElementById("fReason").value = "";
    modal.classList.add("show");
  }
  function closeIoModal() { modal.classList.remove("show"); }
  document.getElementById("ioModalClose").addEventListener("click", closeIoModal);
  document.getElementById("ioCancelBtn").addEventListener("click", closeIoModal);
  modal.addEventListener("click", function (e) { if (e.target === modal) closeIoModal(); });

  document.getElementById("tableBody").addEventListener("click", function (e) {
    var btn = e.target.closest("[data-mark]");
    if (btn) openIoModal(btn.getAttribute("data-mark"), btn.getAttribute("data-direction"));
  });

  document.getElementById("ioSaveBtn").addEventListener("click", function () {
    if (!targetStudentId) return;
    var list = Data.getStudentInOut();
    list.push({ id: Data.uid("io"), studentId: targetStudentId, direction: targetDirection, timestamp: Data.nowIso(), reason: document.getElementById("fReason").value.trim() });
    Data.saveStudentInOut(list);
    App.showToast(targetDirection === "in" ? "Marked in." : "Marked out.");
    closeIoModal();
    render();
  });

  render();
  }
</script>
</body>
</html>
