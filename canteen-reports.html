<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canteen Reports · HostelHub</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="app-shell">
  <div class="sidebar-backdrop"></div>
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main">
    <header class="topbar" id="topbar"></header>

    <main class="content">
      <div class="page-header-row">
        <div>
          <h2>Canteen Reports</h2>
          <p class="desc">Weekly and monthly consumption &amp; cost reports.</p>
        </div>
      </div>

      <div class="page-header-row" style="margin-bottom:16px;">
        <div class="toolbar-filters">
          <label class="hint" style="align-self:center">From</label>
          <input type="date" class="select-filter" id="reportFrom">
          <label class="hint" style="align-self:center">To</label>
          <input type="date" class="select-filter" id="reportTo">
          <button type="button" class="btn btn-outline btn-sm" data-menu-toggle="quickRange">Quick Select &#9662;</button>
          <div class="action-menu" data-menu="quickRange">
            <button type="button" data-quick="week">This Week</button>
            <button type="button" data-quick="month">This Month</button>
          </div>
          <span class="toolbar-meta" id="periodMeta"></span>
        </div>
      </div>

      <div class="stat-grid stat-grid-tight" id="statGrid"></div>

      <div class="panel-grid charts-grid">
        <div class="panel">
          <div class="panel-header"><h3>Daily Usage Cost</h3></div>
          <div id="dailyCostChart"></div>
        </div>
        <div class="panel">
          <div class="panel-header"><h3>Usage Cost by Category</h3></div>
          <div id="catCostChart"></div>
        </div>
      </div>

      <div class="panel-header" style="margin:0 0 10px"><h3>Item Consumption</h3></div>
      <div class="table-card">
        <div class="table-scroll">
          <table class="data-table">
            <thead>
              <tr><th data-sort="name">Item</th><th data-sort="category">Category</th><th data-sort="purchased">Qty Purchased</th><th data-sort="used">Qty Used</th><th data-sort="cost">Usage Cost</th></tr>
            </thead>
            <tbody id="itemBody"></tbody>
          </table>
        </div>
        <div class="table-pagination" id="pagination"></div>
      </div>
    </main>
  </div>
</div>

<script src="assets/data.js"></script>
<script src="assets/business.js"></script>
<script src="assets/app.js"></script>
<script src="assets/charts.js"></script>
<script>
  App.requireAuth();
  if (App.guardPermission("canteen", "read")) {
  App.renderShell({ active: "canteen-reports", title: "Reports", subtitle: "Weekly and monthly consumption & cost reports" });

  var currentPage = 1;
  var PAGE_SIZE = 10;
  var sortState = App.makeSortState();
  var fromInput = document.getElementById("reportFrom");
  var toInput = document.getElementById("reportTo");

  fromInput.value = Data.isoDate(Data.addDays(Data.today(), -6));
  toInput.value = Data.isoDate(Data.today());

  function getReport() {
    var today = Data.isoDate(Data.today());
    var from = fromInput.value || today;
    var to = toInput.value || today;
    if (from > to) { var tmp = from; from = to; to = tmp; }
    return { from: from, to: to, cost: Business.getCanteenUsageCostTotals(from, to), meals: Business.getCanteenMealCount(from, to) };
  }

  function statCard(icon, iconCls, accentCls, value, label) {
    return '<div class="stat-card ' + accentCls + '"><div class="stat-icon ' + iconCls + '">' + App.svg(icon) + '</div>' +
      '<div><div class="stat-value">' + value + '</div><div class="stat-label">' + label + '</div></div></div>';
  }

  function render() {
    var report = getReport();
    var avg = report.meals ? Math.round(report.cost / report.meals) : 0;

    document.getElementById("statGrid").innerHTML =
      statCard("wallet", "icon-indigo", "", "₹" + Charts.fmtCompact(report.cost), "Total usage cost") +
      statCard("mealTray", "icon-green", "accent-green", report.meals, "Total meals served") +
      statCard("coins", "icon-amber", "accent-amber", "₹" + Charts.fmtCompact(avg), "Avg. cost per meal") +
      statCard("calendar", "icon-violet", "accent-violet", Data.displayDate(report.from) + " – " + Data.displayDate(report.to), "Report period");

    var spanDays = Math.round((new Date(report.to) - new Date(report.from)) / 86400000) + 1;
    document.getElementById("periodMeta").textContent = spanDays + " day" + (spanDays === 1 ? "" : "s") + " selected";

    /* Bar chart: daily usage cost across the period */
    var days = [];
    for (var d = 0; d < spanDays; d++) {
      var date = Data.isoDate(Data.addDays(new Date(report.from), d));
      days.push({ label: date.slice(8, 10) + "/" + date.slice(5, 7), value: Business.getCanteenUsageCostTotals(date, date) });
    }
    Charts.renderBarChart(document.getElementById("dailyCostChart"), days, { formatValue: function (v) { return "₹" + Charts.fmtCompact(v); } });

    /* Donut chart: usage cost breakdown by category within the period */
    var items = Data.getCanteenItems();
    var periodUsed = Data.getCanteenStock().filter(function (t) { return (t.type === "outward" || t.type === "mess") && t.date >= report.from && t.date <= report.to; });
    var byCat = {};
    periodUsed.forEach(function (t) {
      var item = items.find(function (i) { return i.id === t.itemId; });
      if (!item) return;
      byCat[item.category] = (byCat[item.category] || 0) + t.totalAmount;
    });
    var donutItems = Object.keys(byCat).map(function (k) { return { label: k, value: byCat[k] }; });
    Charts.renderDonutChart(document.getElementById("catCostChart"), donutItems, { formatValue: function (v) { return "₹" + Charts.fmtCompact(v); }, centerLabel: "Cost" });

    /* Item consumption table for the period */
    var allStock = Data.getCanteenStock();
    function txnsFor(item) { return allStock.filter(function (t) { return t.itemId === item.id && t.date >= report.from && t.date <= report.to; }); }
    function purchasedOf(item) { return txnsFor(item).filter(function (t) { return t.type === "inward"; }).reduce(function (a, t) { return a + t.quantity; }, 0); }
    function usedOf(item) { return txnsFor(item).filter(function (t) { return t.type === "outward" || t.type === "mess"; }).reduce(function (a, t) { return a + t.quantity; }, 0); }
    function costOf(item) { return txnsFor(item).filter(function (t) { return t.type === "outward" || t.type === "mess"; }).reduce(function (a, t) { return a + t.totalAmount; }, 0); }

    var sortedItems = App.sortRows(items, sortState, {
      name: function (item) { return item.name; },
      category: function (item) { return item.category; },
      purchased: purchasedOf,
      cost: costOf,
      used: usedOf
    });

    var itemBody = document.getElementById("itemBody");
    var pageItems = App.paginate(sortedItems, currentPage, PAGE_SIZE);
    if (!items.length) {
      itemBody.innerHTML = '<tr><td colspan="5"><div class="empty-state compact">' + App.svg("box") + '<p>No items yet.</p></div></td></tr>';
    } else {
      itemBody.innerHTML = pageItems.map(function (item) {
        return '<tr>' +
          '<td><strong>' + item.name + '</strong></td>' +
          '<td><span class="chip chip-indigo">' + item.category + '</span></td>' +
          '<td class="num">' + purchasedOf(item).toLocaleString("en-IN") + ' ' + item.unit + '</td>' +
          '<td class="num">' + usedOf(item).toLocaleString("en-IN") + ' ' + item.unit + '</td>' +
          '<td class="num-strong">₹' + costOf(item).toLocaleString("en-IN") + '</td>' +
        '</tr>';
      }).join("");
    }

    currentPage = App.renderPagination(document.getElementById("pagination"), {
      page: currentPage, pageSize: PAGE_SIZE, total: items.length,
      onChange: function (p) { currentPage = p; render(); }
    });

    App.bindSortableTable(itemBody.closest("table").tHead, sortState, function () { currentPage = 1; render(); });
  }

  [fromInput, toInput].forEach(function (input) {
    input.addEventListener("change", function () { currentPage = 1; render(); });
  });

  document.querySelectorAll('[data-menu="quickRange"] [data-quick]').forEach(function (btn) {
    btn.addEventListener("click", function () {
      var mode = btn.getAttribute("data-quick");
      toInput.value = Data.isoDate(Data.today());
      fromInput.value = Data.isoDate(Data.addDays(Data.today(), mode === "week" ? -6 : -29));
      currentPage = 1;
      render();
    });
  });

  render();
  }
</script>
</body>
</html>
