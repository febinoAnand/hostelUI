<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hosteller Profile · HostelHub</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="app-shell">
  <div class="sidebar-backdrop"></div>
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main">
    <header class="topbar" id="topbar"></header>

    <main class="content">
      <div class="page-header-row">
        <a class="btn btn-outline btn-sm" href="students.html">&larr; Back to Hostellers</a>
      </div>

      <div id="notFound" style="display:none" class="empty-state">
        <p>Hosteller record not found.</p>
      </div>

      <div id="pageBody" style="display:none">
        <div class="profile-header">
          <div class="profile-avatar" id="pAvatar"></div>
          <div>
            <h2 id="pName" style="font-size:20px"></h2>
            <p class="desc" id="pMeta"></p>
          </div>
          <span class="status-pill" id="pStatus" style="margin-left:auto"></span>
        </div>

        <div class="stat-grid stat-grid-tight" id="statGrid"></div>

        <div id="tabsMount"></div>
        <div id="tabPanels"></div>
      </div>
    </main>
  </div>
</div>

<script src="assets/data.js"></script>
<script src="assets/business.js"></script>
<script src="assets/app.js"></script>
<script src="assets/charts.js"></script>
<script>
  App.requireAuth();
  if (App.guardPermission("students", "read")) {
  App.renderShell({ active: "students", title: "Hosteller Profile", subtitle: "Full master record & activity" });

  var params = new URLSearchParams(window.location.search);
  var studentId = params.get("id");
  var student = Data.getStudents().find(function (s) { return s.id === studentId; });

  if (!student) {
    document.getElementById("notFound").style.display = "flex";
  } else {
    document.getElementById("pageBody").style.display = "block";
    var room = Data.getRooms().find(function (r) { return r.id === student.roomId; });

    document.getElementById("pAvatar").textContent = App.initials(student.name);
    document.getElementById("pName").textContent = student.name;
    document.getElementById("pMeta").textContent = student.regNo + " · " + student.course + " · Year " + student.year + (room ? " · Room " + room.roomNumber : " · No room assigned");
    document.getElementById("pStatus").textContent = student.status;
    document.getElementById("pStatus").className = "status-pill " + student.status;

    var feeSummary = Business.getFeeSummary(student.id);
    var advanceBalance = Business.getAdvanceBalance(student.id);
    var currentStatus = Business.getCurrentStatus(student.id);

    document.getElementById("statGrid").innerHTML =
      '<div class="stat-card"><div class="stat-icon icon-indigo">' + App.svg("inout") + '</div><div><div class="stat-value" style="text-transform:capitalize">' + currentStatus + '</div><div class="stat-label">Current status</div></div></div>' +
      '<div class="stat-card accent-green"><div class="stat-icon icon-green">' + App.svg("receipt") + '</div><div><div class="stat-value">₹' + Charts.fmtCompact(feeSummary.paid) + '</div><div class="stat-label">Fees paid</div></div></div>' +
      '<div class="stat-card accent-red"><div class="stat-icon icon-red">' + App.svg("wallet") + '</div><div><div class="stat-value">₹' + Charts.fmtCompact(feeSummary.due) + '</div><div class="stat-label">Fees due</div></div></div>' +
      '<div class="stat-card accent-amber"><div class="stat-icon icon-amber">' + App.svg("coins") + '</div><div><div class="stat-value">₹' + Charts.fmtCompact(advanceBalance) + '</div><div class="stat-label">Advance balance</div></div></div>';

    var TABS = [
      { key: "overview", label: "Overview" },
      { key: "inout", label: "In / Out Log" },
      { key: "fees", label: "Fees & Advance" },
      { key: "travel", label: "Travel" },
      { key: "outpass", label: "Outpass" }
    ];
    var activeTab = "overview";
    var PAGE_SIZE = 10;
    var inoutPage = 1, inoutTotal = 0, inoutSort = App.makeSortState();
    var ledgerPage = 1, ledgerTotal = 0, ledgerSort = App.makeSortState();
    var travelPage = 1, travelTotal = 0, travelSort = App.makeSortState();
    var opPage = 1, opTotal = 0, opSort = App.makeSortState();

    var inoutView = "table", travelView = "table";
    var todayForCal = Data.today();
    var inoutCalYear = todayForCal.getFullYear(), inoutCalMonth = todayForCal.getMonth();
    var travelCalYear = todayForCal.getFullYear(), travelCalMonth = todayForCal.getMonth();

    function viewSwitchHtml(scope, current) {
      var views = [["table", "Table"], ["calendar", "Calendar"], ["timeline", "Timeline"]];
      return '<div class="page-tabs" style="margin-bottom:16px" data-view-scope="' + scope + '">' + views.map(function (v) {
        return '<button type="button" class="page-tab' + (v[0] === current ? " active" : "") + '" data-view="' + v[0] + '">' + v[1] + '</button>';
      }).join("") + '</div>';
    }

    function renderTabs() {
      document.getElementById("tabsMount").innerHTML = '<div class="page-tabs">' + TABS.map(function (t) {
        return '<button type="button" class="page-tab' + (t.key === activeTab ? " active" : "") + '" data-tab="' + t.key + '">' + t.label + '</button>';
      }).join("") + '</div>';
      document.querySelectorAll("[data-tab]").forEach(function (btn) {
        btn.addEventListener("click", function () { activeTab = btn.getAttribute("data-tab"); renderTabs(); renderPanel(); });
      });
    }

    function emptyRow(msg) { return '<div class="empty-state compact">' + App.svg("fileText") + '<p>' + msg + '</p></div>'; }

    function renderOverview() {
      return '<div class="detail-grid">' +
        '<div class="detail-card"><div class="detail-card-header">Personal Details</div><div class="detail-rows">' +
          '<div class="detail-row"><span>Blood Group</span><strong>' + student.bloodGroup + '</strong></div>' +
          '<div class="detail-row"><span>Admission Date</span><strong>' + Data.displayDate(student.admissionDate) + '</strong></div>' +
          '<div class="detail-row"><span>Address</span><strong>' + (student.address || "-") + '</strong></div>' +
          '<div class="detail-row"><span>Room</span><strong>' + (room ? room.roomNumber + " (" + room.block + " block, " + room.type + ")" : "Unassigned") + '</strong></div>' +
        '</div></div>' +
        '<div class="detail-card"><div class="detail-card-header">Guardian Details</div><div class="detail-rows">' +
          '<div class="detail-row"><span>Name</span><strong>' + (student.guardianName || "-") + '</strong></div>' +
          '<div class="detail-row"><span>Phone</span><strong>' + (student.guardianPhone || "-") + '</strong></div>' +
          '<div class="detail-row"><span>Course</span><strong>' + student.course + '</strong></div>' +
          '<div class="detail-row"><span>Year</span><strong>Year ' + student.year + '</strong></div>' +
        '</div></div>' +
      '</div>';
    }

    function renderInOutRailTimeline(logs) {
      if (!logs.length) return emptyRow("No in/out activity recorded yet.");
      return '<div class="rail-timeline">' + logs.map(function (l) {
        var isIn = l.direction === "in";
        return '<div class="rail-item">' +
          '<div class="rail-marker ' + (isIn ? "in" : "out") + '">' + App.svg(isIn ? "checkCircle" : "inout") + '</div>' +
          '<div class="rail-content">' +
            '<div class="rail-top"><strong>' + (isIn ? "Checked In" : "Checked Out") + '</strong><span class="rail-time">' + Data.displayDateTime(l.timestamp) + '</span></div>' +
            (l.reason ? '<p class="rail-reason">' + l.reason + '</p>' : '') +
          '</div>' +
        '</div>';
      }).join("") + '</div>';
    }

    function renderInOutCalendarInto(container) {
      var logs = Data.getStudentInOut().filter(function (l) { return l.studentId === student.id; });
      App.renderMonthCalendar(container, {
        year: inoutCalYear, month: inoutCalMonth,
        getDayContent: function (dateIso) {
          var dayLogs = logs.filter(function (l) { return l.timestamp.slice(0, 10) === dateIso; });
          if (!dayLogs.length) return "";
          var hasIn = dayLogs.some(function (l) { return l.direction === "in"; });
          var hasOut = dayLogs.some(function (l) { return l.direction === "out"; });
          var titleParts = dayLogs.map(function (l) { return (l.direction === "in" ? "In" : "Out") + " " + l.timestamp.slice(11, 16) + (l.reason ? " (" + l.reason + ")" : ""); });
          var html = "";
          if (hasIn) html += '<span class="cal-event in" title="' + titleParts.join(" · ").replace(/"/g, "&quot;") + '">In</span>';
          if (hasOut) html += '<span class="cal-event out" title="' + titleParts.join(" · ").replace(/"/g, "&quot;") + '">Out</span>';
          return html;
        },
        onNav: function (y, m) { inoutCalYear = y; inoutCalMonth = m; renderInOutCalendarInto(container); }
      });
    }

    function renderInOut() {
      var html = '<div class="panel">' + viewSwitchHtml("inout", inoutView);
      var logs = Data.getStudentInOut().filter(function (l) { return l.studentId === student.id; })
        .sort(function (a, b) { return new Date(b.timestamp) - new Date(a.timestamp); });

      if (inoutView === "calendar") {
        html += '<div id="inoutCalendarMount"></div>';
      } else if (inoutView === "timeline") {
        html += renderInOutRailTimeline(logs);
      } else {
        logs = App.sortRows(logs, inoutSort, {
          direction: function (l) { return l.direction; }, timestamp: function (l) { return l.timestamp; }, reason: function (l) { return l.reason || ""; }
        });
        inoutTotal = logs.length;
        if (!logs.length) {
          html += emptyRow("No in/out activity recorded yet.");
        } else {
          var pageItems = App.paginate(logs, inoutPage, PAGE_SIZE);
          html += '<div class="table-scroll"><table class="data-table"><thead><tr><th data-sort="direction">Direction</th><th data-sort="timestamp">Date & Time</th><th data-sort="reason">Reason</th></tr></thead><tbody>' +
            pageItems.map(function (l) {
              return '<tr><td><span class="status-pill ' + l.direction + '">' + l.direction + '</span></td><td>' + Data.displayDateTime(l.timestamp) + '</td><td>' + (l.reason || "-") + '</td></tr>';
            }).join("") + '</tbody></table></div><div class="table-pagination" id="inoutPagination"></div>';
        }
      }
      html += '</div>';
      return html;
    }

    function renderFees() {
      var ledger = feeSummary.ledger.slice().sort(function (a, b) { return new Date(b.date) - new Date(a.date); });
      ledger = App.sortRows(ledger, ledgerSort, {
        type: function (l) { return l.type; }, date: function (l) { return l.date; }, mode: function (l) { return l.mode || ""; },
        receipt: function (l) { return l.receiptNo || ""; }, amount: function (l) { return l.amount; }
      });
      ledgerTotal = ledger.length;
      var advances = Data.getAdvances().filter(function (a) { return a.studentId === student.id; });
      var html = '<div class="panel-grid even">';
      html += '<div class="panel"><div class="panel-header"><h3>Fee Ledger</h3><div style="display:flex;align-items:center;gap:10px"><span class="panel-tag">' + feeSummary.status + '</span><a href="invoice.html?id=' + student.id + '">View Full Invoice</a></div></div>';
      if (ledger.length) {
        var pageItems = App.paginate(ledger, ledgerPage, PAGE_SIZE);
        html += '<div class="table-scroll"><table class="data-table"><thead><tr><th data-sort="type">Type</th><th data-sort="date">Date</th><th data-sort="mode">Mode</th><th data-sort="receipt">Receipt</th><th class="num" data-sort="amount">Amount</th></tr></thead><tbody>' +
          pageItems.map(function (l) {
            return '<tr><td><span class="chip ' + (l.type === "invoice" ? "chip-slate" : "chip-green") + '">' + l.type + '</span></td><td>' + Data.displayDate(l.date) + '</td><td>' + (l.mode || "-") + '</td><td class="cell-mono">' + (l.receiptNo || "-") + '</td><td class="num num-strong">₹' + l.amount.toLocaleString("en-IN") + '</td></tr>';
          }).join("") + '</tbody></table></div><div class="table-pagination" id="ledgerPagination"></div>';
      } else {
        html += emptyRow("No fee records yet.");
      }
      html += '</div>';
      html += '<div class="panel"><div class="panel-header"><h3>Advances</h3><span class="panel-tag">₹' + advanceBalance.toLocaleString("en-IN") + '</span></div>';
      html += advances.length ? '<div class="activity-list">' + advances.map(function (a) {
        return '<div class="activity-item"><div class="activity-dot"></div><div><p><strong>₹' + a.amount.toLocaleString("en-IN") + '</strong> — ' + a.purpose + '</p><span>' + Data.displayDate(a.date) + ' · Balance ₹' + a.balance.toLocaleString("en-IN") + '</span></div></div>';
      }).join("") : emptyRow("No advances recorded.");
      html += '</div></div>';
      return html;
    }

    function renderTravelJourneyTimeline(travel) {
      if (!travel.length) return emptyRow("No travel records yet.");
      return '<div class="journey-timeline">' + travel.map(function (t) {
        var isHome = t.type === "home";
        return '<div class="journey-item ' + (isHome ? "home" : "return") + '">' +
          '<div class="journey-icon">' + App.svg(isHome ? "bus" : "door") + '</div>' +
          '<div class="journey-card">' +
            '<div class="journey-card-head"><span class="chip ' + (isHome ? "chip-amber" : "chip-green") + '">' + (isHome ? "Home Departure" : "Return") + '</span><strong>' + Data.displayDate(t.date) + '</strong></div>' +
            '<div class="journey-card-body">' +
              '<span>' + App.svg("bus") + " " + t.mode + '</span>' +
              (isHome && t.expectedReturnDate ? '<span>Expected back ' + Data.displayDate(t.expectedReturnDate) + '</span>' : '') +
              (t.notes ? '<span>' + t.notes + '</span>' : '') +
            '</div>' +
          '</div>' +
        '</div>';
      }).join("") + '</div>';
    }

    function renderTravelCalendarInto(container) {
      var travel = Data.getTravel().filter(function (t) { return t.studentId === student.id; });
      App.renderMonthCalendar(container, {
        year: travelCalYear, month: travelCalMonth,
        getDayContent: function (dateIso) {
          var dayEntries = travel.filter(function (t) { return t.date === dateIso; });
          if (!dayEntries.length) return "";
          return dayEntries.map(function (t) {
            var isHome = t.type === "home";
            var title = (isHome ? "Home departure" : "Return") + " · " + t.mode + (t.notes ? " · " + t.notes : "");
            return '<span class="cal-event ' + (isHome ? "home" : "return") + '" title="' + title.replace(/"/g, "&quot;") + '">' + (isHome ? "Home" : "Return") + '</span>';
          }).join("");
        },
        onNav: function (y, m) { travelCalYear = y; travelCalMonth = m; renderTravelCalendarInto(container); }
      });
    }

    function renderTravel() {
      var html = '<div class="panel">' + viewSwitchHtml("travel", travelView);
      var travel = Data.getTravel().filter(function (t) { return t.studentId === student.id; }).sort(function (a, b) { return new Date(b.date) - new Date(a.date); });

      if (travelView === "calendar") {
        html += '<div id="travelCalendarMount"></div>';
      } else if (travelView === "timeline") {
        html += renderTravelJourneyTimeline(travel);
      } else {
        travel = App.sortRows(travel, travelSort, {
          type: function (t) { return t.type; }, date: function (t) { return t.date; },
          expectedReturn: function (t) { return t.expectedReturnDate || ""; }, mode: function (t) { return t.mode; }, notes: function (t) { return t.notes || ""; }
        });
        travelTotal = travel.length;
        if (!travel.length) {
          html += emptyRow("No travel records yet.");
        } else {
          var pageItems = App.paginate(travel, travelPage, PAGE_SIZE);
          html += '<div class="table-scroll"><table class="data-table"><thead><tr><th data-sort="type">Type</th><th data-sort="date">Date</th><th data-sort="expectedReturn">Expected Return</th><th data-sort="mode">Mode</th><th data-sort="notes">Notes</th></tr></thead><tbody>' +
            pageItems.map(function (t) {
              return '<tr><td><span class="chip ' + (t.type === "home" ? "chip-amber" : "chip-green") + '">' + t.type + '</span></td><td>' + Data.displayDate(t.date) + '</td><td>' + (t.expectedReturnDate ? Data.displayDate(t.expectedReturnDate) : "-") + '</td><td>' + t.mode + '</td><td>' + (t.notes || "-") + '</td></tr>';
            }).join("") + '</tbody></table></div><div class="table-pagination" id="travelPagination"></div>';
        }
      }
      html += '</div>';
      return html;
    }

    function renderOutpass() {
      var list = Data.getOutpass().filter(function (o) { return o.studentId === student.id; }).sort(function (a, b) { return new Date(b.fromDatetime) - new Date(a.fromDatetime); });
      list = App.sortRows(list, opSort, {
        reason: function (o) { return o.reason; }, from: function (o) { return o.fromDatetime; }, to: function (o) { return o.toDatetime; },
        status: function (o) { return o.status; }, approver: function (o) { return o.approvedBy || ""; }
      });
      opTotal = list.length;
      if (!list.length) return '<div class="panel">' + emptyRow("No outpass requests yet.") + '</div>';
      var pageItems = App.paginate(list, opPage, PAGE_SIZE);
      return '<div class="panel"><div class="table-scroll"><table class="data-table"><thead><tr><th data-sort="reason">Reason</th><th data-sort="from">From</th><th data-sort="to">To</th><th data-sort="status">Status</th><th data-sort="approver">Approved By</th></tr></thead><tbody>' +
        pageItems.map(function (o) {
          return '<tr><td>' + o.reason + '</td><td>' + Data.displayDateTime(o.fromDatetime) + '</td><td>' + Data.displayDateTime(o.toDatetime) + '</td><td><span class="status-pill ' + o.status + '">' + o.status + '</span></td><td>' + (o.approvedBy || "-") + '</td></tr>';
        }).join("") + '</tbody></table></div><div class="table-pagination" id="opPagination"></div></div>';
    }

    function renderPanel() {
      var map = { overview: renderOverview, inout: renderInOut, fees: renderFees, travel: renderTravel, outpass: renderOutpass };
      document.getElementById("tabPanels").innerHTML = map[activeTab]();

      function finish(pageVar, setPage, total, sortState, paginationId, onPageChange) {
        var container = document.getElementById(paginationId);
        if (container) setPage(App.renderPagination(container, { page: pageVar, pageSize: PAGE_SIZE, total: total, onChange: onPageChange }));
        var t = document.querySelector("#tabPanels table");
        App.bindSortableTable(t && t.tHead, sortState, function () { onPageChange(1); });
      }

      if (activeTab === "inout") {
        if (inoutView === "calendar") renderInOutCalendarInto(document.getElementById("inoutCalendarMount"));
        finish(inoutPage, function (p) { inoutPage = p; }, inoutTotal, inoutSort, "inoutPagination", function (p) { inoutPage = p; renderPanel(); });
      } else if (activeTab === "fees") {
        finish(ledgerPage, function (p) { ledgerPage = p; }, ledgerTotal, ledgerSort, "ledgerPagination", function (p) { ledgerPage = p; renderPanel(); });
      } else if (activeTab === "travel") {
        if (travelView === "calendar") renderTravelCalendarInto(document.getElementById("travelCalendarMount"));
        finish(travelPage, function (p) { travelPage = p; }, travelTotal, travelSort, "travelPagination", function (p) { travelPage = p; renderPanel(); });
      } else if (activeTab === "outpass") {
        finish(opPage, function (p) { opPage = p; }, opTotal, opSort, "opPagination", function (p) { opPage = p; renderPanel(); });
      }
    }

    document.getElementById("tabPanels").addEventListener("click", function (e) {
      var btn = e.target.closest("[data-view]");
      if (!btn) return;
      var scope = btn.closest("[data-view-scope]").getAttribute("data-view-scope");
      var view = btn.getAttribute("data-view");
      if (scope === "inout") { inoutView = view; inoutPage = 1; }
      else if (scope === "travel") { travelView = view; travelPage = 1; }
      renderPanel();
    });

    renderTabs();
    renderPanel();
  }
  }
</script>
</body>
</html>
