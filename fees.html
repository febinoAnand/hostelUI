<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payments · HostelHub</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="app-shell">
  <div class="sidebar-backdrop"></div>
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main">
    <header class="topbar" id="topbar"></header>

    <main class="content">
      <div class="page-header-row">
        <div>
          <h2>Payments</h2>
          <p class="desc">Hostel-wide invoicing, collection and outstanding dues.</p>
        </div>
        <div class="page-header-actions">
          <a class="btn btn-outline" href="fee-structure.html">View Fee Structures</a>
        </div>
      </div>

      <div class="stat-grid stat-grid-tight" id="statGrid"></div>

      <div class="panel" style="margin-bottom:18px">
        <div class="panel-header"><h3>Paid vs Due</h3></div>
        <div id="feeDonut"></div>
      </div>

      <div class="table-card">
        <div class="table-toolbar">
          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
            <input type="text" id="searchInput" placeholder="Search by hosteller name...">
          </div>
          <div class="toolbar-filters">
            <select class="select-filter" id="statusFilter">
              <option value="">All status</option>
              <option value="paid">Paid</option>
              <option value="partial">Partial</option>
              <option value="pending">Pending</option>
            </select>
            <label class="hint" style="align-self:center">Paid between</label>
            <input type="date" class="select-filter" id="paidFrom">
            <input type="date" class="select-filter" id="paidTo">
            <span class="toolbar-meta" id="toolbarMeta"></span>
          </div>
        </div>
        <div class="table-scroll">
          <table class="data-table">
            <thead>
              <tr>
                <th data-sort="name">Hosteller</th><th data-sort="room">Room</th><th data-sort="invoiced">Invoiced</th><th data-sort="paid">Paid</th><th data-sort="due">Due</th><th data-sort="status">Status</th><th data-sort="lastPayment">Last Payment</th><th></th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
        <div class="table-pagination" id="pagination"></div>
      </div>
    </main>
  </div>
</div>

<div class="modal-overlay" id="payModal">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="payModalTitle">Record Payment</h3>
      <button class="modal-close" id="payModalClose">&times;</button>
    </div>
    <div class="modal-body">
      <form id="payForm">
        <div class="field-grid">
          <div class="field"><label>Amount (₹) *</label><input type="number" id="fAmount" min="1" required></div>
          <div class="field"><label>Payment Date *</label><input type="date" id="fDate" required></div>
          <div class="field span-2">
            <label>Payment Mode *</label>
            <select id="fMode" required>
              <optgroup label="Manual">
                <option value="Cash">Cash</option>
              </optgroup>
              <optgroup label="Digital">
                <option value="UPI">UPI</option>
                <option value="Bank Transfer">Bank Transfer</option>
                <option value="Card">Card</option>
              </optgroup>
            </select>
          </div>
          <div class="field span-2"><label>Description</label><input type="text" id="fDescription" placeholder="e.g. Term 2 payment"></div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" id="payCancelBtn">Cancel</button>
      <button class="btn btn-primary" id="paySaveBtn">Save Payment</button>
    </div>
  </div>
</div>

<script src="assets/data.js"></script>
<script src="assets/business.js"></script>
<script src="assets/app.js"></script>
<script src="assets/charts.js"></script>
<script>
  App.requireAuth();
  if (App.guardPermission("fees", "read")) {
  App.renderShell({ active: "fees", title: "Payments", subtitle: "Hostel-wide invoicing and payment tracking" });

  var canUpdate = App.can("fees", "update");
  var searchTerm = "", statusFilterVal = "";
  var currentPage = 1;
  var PAGE_SIZE = 10;
  var sortState = App.makeSortState();
  function lastPaymentOf(s) {
    var payments = Business.getFeeSummary(s.id).ledger.filter(function (l) { return l.type === "payment"; }).sort(function (a, b) { return new Date(b.date) - new Date(a.date); });
    return payments[0] || null;
  }

  function render() {
    var stats = Business.getHostelFeeStats();
    var totalHostellers = stats.paidCount + stats.partialCount + stats.unpaidCount;
    document.getElementById("statGrid").innerHTML =
      '<div class="stat-card"><div class="stat-icon icon-indigo">' + App.svg("receipt") + '</div><div><div class="stat-value">₹' + Charts.fmtCompact(stats.totalInvoiced) + '</div><div class="stat-label">Total invoiced</div></div></div>' +
      '<div class="stat-card accent-green"><div class="stat-icon icon-green">' + App.svg("wallet") + '</div><div><div class="stat-value">₹' + Charts.fmtCompact(stats.totalPaid) + '</div><div class="stat-label">Total collected</div></div></div>' +
      '<div class="stat-card accent-red"><div class="stat-icon icon-red">' + App.svg("alertTriangle") + '</div><div><div class="stat-value">₹' + Charts.fmtCompact(stats.totalDue) + '</div><div class="stat-label">Total due</div></div></div>' +
      '<div class="stat-card accent-cyan"><div class="stat-icon icon-cyan">' + App.svg("checkCircle") + '</div><div><div class="stat-value">' + stats.paidCount + ' / ' + totalHostellers + '</div><div class="stat-label">Hostellers fully paid</div></div></div>';

    Charts.renderDonutChart(document.getElementById("feeDonut"), [
      { label: "Collected", value: stats.totalPaid, color: "#059669" },
      { label: "Due", value: stats.totalDue, color: "#dc2626" }
    ], { centerLabel: "Total", formatValue: function (v) { return "₹" + Charts.fmtCompact(v); } });

    renderTable();
  }

  function renderTable() {
    var students = Data.getStudents().filter(function (s) { return s.status === "active"; });
    var rooms = Data.getRooms();
    var q = searchTerm.toLowerCase();
    var paidFrom = document.getElementById("paidFrom").value;
    var paidTo = document.getElementById("paidTo").value;
    var filtered = students.filter(function (s) {
      var summary = Business.getFeeSummary(s.id);
      var matchesSearch = !q || s.name.toLowerCase().indexOf(q) > -1;
      var matchesStatus = !statusFilterVal || summary.status === statusFilterVal;
      var matchesPaidRange = true;
      if (paidFrom || paidTo) {
        var payments = summary.ledger.filter(function (l) { return l.type === "payment"; });
        matchesPaidRange = payments.some(function (p) { return (!paidFrom || p.date >= paidFrom) && (!paidTo || p.date <= paidTo); });
      }
      return matchesSearch && matchesStatus && matchesPaidRange;
    });
    filtered = App.sortRows(filtered, sortState, {
      name: function (s) { return s.name; },
      room: function (s) { var r = rooms.find(function (x) { return x.id === s.roomId; }); return r ? r.roomNumber : ""; },
      invoiced: function (s) { return Business.getFeeSummary(s.id).invoiced; },
      paid: function (s) { return Business.getFeeSummary(s.id).paid; },
      due: function (s) { return Business.getFeeSummary(s.id).due; },
      status: function (s) { return Business.getFeeSummary(s.id).status; },
      lastPayment: function (s) { var p = lastPaymentOf(s); return p ? p.date : ""; }
    });
    document.getElementById("toolbarMeta").textContent = filtered.length + " of " + students.length + " hostellers";

    var tbody = document.getElementById("tableBody");
    var pageItems = App.paginate(filtered, currentPage, PAGE_SIZE);
    if (!filtered.length) {
      tbody.innerHTML = '<tr><td colspan="8"><div class="empty-state compact">' + App.svg("receipt") + '<p>No hostellers found.</p></div></td></tr>';
    } else {
      tbody.innerHTML = pageItems.map(function (s) {
        var room = rooms.find(function (r) { return r.id === s.roomId; });
        var summary = Business.getFeeSummary(s.id);
        var lastPayment = lastPaymentOf(s);
        return '<tr>' +
          '<td><div class="cell-user"><div class="cell-avatar">' + App.initials(s.name) + '</div><div><strong>' + s.name + '</strong></div></div></td>' +
          '<td>' + (room ? '<span class="chip chip-indigo">' + room.roomNumber + '</span>' : '<span class="chip chip-slate">Unassigned</span>') + '</td>' +
          '<td class="num">₹' + summary.invoiced.toLocaleString("en-IN") + '</td>' +
          '<td class="num">₹' + summary.paid.toLocaleString("en-IN") + '</td>' +
          '<td class="num-strong">₹' + summary.due.toLocaleString("en-IN") + '</td>' +
          '<td><span class="status-pill ' + summary.status + '">' + summary.status + '</span></td>' +
          '<td>' + (lastPayment ? Data.displayDate(lastPayment.date) + ' · ₹' + lastPayment.amount.toLocaleString("en-IN") : '-') + '</td>' +
          '<td class="row-actions">' +
            '<a class="btn btn-sm btn-outline" href="invoice.html?id=' + s.id + '" style="margin-right:6px">' + App.svg("fileText") + ' Invoice</a>' +
            (canUpdate ? '<button class="btn btn-sm btn-primary" data-pay="' + s.id + '">Record Payment</button>' : '') +
          '</td>' +
        '</tr>';
      }).join("");
    }

    currentPage = App.renderPagination(document.getElementById("pagination"), {
      page: currentPage, pageSize: PAGE_SIZE, total: filtered.length,
      onChange: function (p) { currentPage = p; renderTable(); }
    });

    App.bindSortableTable(tbody.closest("table").tHead, sortState, function () { currentPage = 1; renderTable(); });
  }

  document.getElementById("searchInput").addEventListener("input", function (e) { searchTerm = e.target.value; currentPage = 1; renderTable(); });
  document.getElementById("statusFilter").addEventListener("change", function (e) { statusFilterVal = e.target.value; currentPage = 1; renderTable(); });
  document.getElementById("paidFrom").addEventListener("change", function () { currentPage = 1; renderTable(); });
  document.getElementById("paidTo").addEventListener("change", function () { currentPage = 1; renderTable(); });

  /* ---------------- Payment modal ---------------- */
  var payModal = document.getElementById("payModal");
  var payStudentId = "";
  function openPayModal(studentId) {
    payStudentId = studentId;
    var s = Data.getStudents().find(function (x) { return x.id === studentId; });
    document.getElementById("payModalTitle").textContent = "Record Payment — " + (s ? s.name : "");
    document.getElementById("fAmount").value = "";
    document.getElementById("fDate").value = Data.isoDate(Data.today());
    document.getElementById("fMode").value = "Cash";
    document.getElementById("fDescription").value = "";
    payModal.classList.add("show");
  }
  function closePayModal() { payModal.classList.remove("show"); }
  document.getElementById("payModalClose").addEventListener("click", closePayModal);
  document.getElementById("payCancelBtn").addEventListener("click", closePayModal);
  payModal.addEventListener("click", function (e) { if (e.target === payModal) closePayModal(); });

  document.getElementById("tableBody").addEventListener("click", function (e) {
    var btn = e.target.closest("[data-pay]");
    if (btn) openPayModal(btn.getAttribute("data-pay"));
  });

  document.getElementById("paySaveBtn").addEventListener("click", function () {
    var amount = parseFloat(document.getElementById("fAmount").value);
    if (!payStudentId || !amount || amount <= 0) { App.showToast("Enter a valid payment amount.", true); return; }
    var ledger = Data.getFeeLedger();
    ledger.push({
      id: Data.uid("fl"), studentId: payStudentId, type: "payment", amount: amount,
      date: document.getElementById("fDate").value || Data.isoDate(Data.today()),
      mode: document.getElementById("fMode").value,
      receiptNo: "RCT-" + Date.now().toString().slice(-6),
      description: document.getElementById("fDescription").value.trim()
    });
    Data.saveFeeLedger(ledger);
    App.showToast("Payment recorded.");
    closePayModal();
    render();
  });

  render();
  }
</script>
</body>
</html>
