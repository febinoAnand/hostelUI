<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff In / Out Board · HostelHub</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="app-shell">
  <div class="sidebar-backdrop"></div>
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main">
    <header class="topbar" id="topbar"></header>

    <main class="content">
      <div class="page-header-row">
        <div>
          <h2>Staff In / Out Board</h2>
          <p class="desc">Live attendance for every active staff member, today.</p>
        </div>
      </div>

      <div class="stat-grid stat-grid-tight" id="statGrid"></div>

      <div class="table-card">
        <div class="table-toolbar">
          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
            <input type="text" id="searchInput" placeholder="Search by name or designation...">
          </div>
          <div class="toolbar-filters">
            <span class="toolbar-meta" id="toolbarMeta"></span>
          </div>
        </div>
        <div class="table-scroll">
          <table class="data-table">
            <thead>
              <tr>
                <th>Staff</th><th>Designation</th><th>Status</th><th>In Time</th><th>Out Time</th><th></th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="assets/data.js"></script>
<script src="assets/business.js"></script>
<script src="assets/app.js"></script>
<script src="assets/charts.js"></script>
<script>
  App.requireAuth();
  if (App.guardPermission("staff", "read")) {
  App.renderShell({ active: "staff-attendance", title: "Staff In / Out Board", subtitle: "Today's live attendance" });

  var searchTerm = "";
  var todayIso = Data.isoDate(Data.today());

  function pad2(n) { return n < 10 ? "0" + n : "" + n; }
  function currentTimeHHMM() {
    var d = new Date();
    return pad2(d.getHours()) + ":" + pad2(d.getMinutes());
  }

  function todayRecordFor(staffId) {
    return Data.getStaffAttendance().find(function (a) { return a.staffId === staffId && a.date === todayIso; }) || null;
  }

  function render() {
    var active = Data.getStaff().filter(function (s) { return s.isActive; });
    var q = searchTerm.toLowerCase();
    var filtered = active.filter(function (s) {
      return !q || s.name.toLowerCase().indexOf(q) > -1 || s.designation.toLowerCase().indexOf(q) > -1;
    });
    document.getElementById("toolbarMeta").textContent = filtered.length + " of " + active.length + " staff";

    var tbody = document.getElementById("tableBody");
    if (!filtered.length) {
      tbody.innerHTML = '<tr><td colspan="6"><div class="empty-state compact">' + App.svg("inout") + '<p>No staff found.</p></div></td></tr>';
    } else {
      tbody.innerHTML = filtered.map(function (s) {
        var rec = todayRecordFor(s.id);
        var status = rec ? rec.status : "pending";
        var statusLabel = rec ? rec.status : "Unmarked";
        return '<tr>' +
          '<td><a href="staff-detail.html?id=' + s.id + '"><div class="cell-user"><div class="cell-avatar">' + App.initials(s.name) + '</div>' +
          '<div><strong>' + s.name + '</strong></div></div></a></td>' +
          '<td><span class="chip chip-indigo">' + s.designation + '</span></td>' +
          '<td><span class="status-pill ' + status + '">' + statusLabel + '</span></td>' +
          '<td>' + (rec && rec.inTime ? rec.inTime : "-") + '</td>' +
          '<td>' + (rec && rec.outTime ? rec.outTime : "-") + '</td>' +
          '<td class="row-actions" style="text-align:right;white-space:nowrap">' +
            '<button class="btn btn-outline btn-sm" data-mark="present" data-id="' + s.id + '" style="margin-right:6px">' + App.svg("checkCircle") + ' Present</button>' +
            '<button class="btn btn-outline btn-sm" data-mark="absent" data-id="' + s.id + '">' + App.svg("xCircle") + ' Absent</button>' +
          '</td>' +
        '</tr>';
      }).join("");
    }

    var statGrid = document.getElementById("statGrid");
    var present = active.filter(function (s) { var r = todayRecordFor(s.id); return r && r.status === "present"; }).length;
    var absent = active.filter(function (s) { var r = todayRecordFor(s.id); return r && r.status === "absent"; }).length;
    var unmarked = active.length - present - absent;
    statGrid.innerHTML =
      '<div class="stat-card"><div class="stat-icon icon-indigo">' + App.svg("idCard") + '</div><div><div class="stat-value">' + active.length + '</div><div class="stat-label">Total active staff</div></div></div>' +
      '<div class="stat-card accent-green"><div class="stat-icon icon-green">' + App.svg("checkCircle") + '</div><div><div class="stat-value">' + present + '</div><div class="stat-label">Present today</div></div></div>' +
      '<div class="stat-card accent-red"><div class="stat-icon icon-red">' + App.svg("xCircle") + '</div><div><div class="stat-value">' + absent + '</div><div class="stat-label">Absent today</div></div></div>' +
      '<div class="stat-card accent-amber"><div class="stat-icon icon-amber">' + App.svg("clock") + '</div><div><div class="stat-value">' + unmarked + '</div><div class="stat-label">Not yet marked</div></div></div>';
  }

  function markAttendance(staffId, status) {
    var list = Data.getStaffAttendance();
    var existing = list.find(function (a) { return a.staffId === staffId && a.date === todayIso; });
    var inTime = status === "present" ? currentTimeHHMM() : "";
    if (existing) {
      list = list.map(function (a) {
        if (a.id !== existing.id) return a;
        return { id: a.id, staffId: staffId, date: todayIso, status: status, inTime: inTime, outTime: "" };
      });
    } else {
      list = list.concat([{ id: Data.uid("sa"), staffId: staffId, date: todayIso, status: status, inTime: inTime, outTime: "" }]);
    }
    Data.saveStaffAttendance(list);
    App.showToast("Marked " + status + ".");
    render();
  }

  document.getElementById("searchInput").addEventListener("input", function (e) { searchTerm = e.target.value; render(); });

  document.getElementById("tableBody").addEventListener("click", function (e) {
    var markBtn = e.target.closest("[data-mark]");
    if (markBtn) { markAttendance(markBtn.getAttribute("data-id"), markBtn.getAttribute("data-mark")); }
  });

  render();
  }
</script>
</body>
</html>
